version: "3.8"

services:
  # MySQL Database (Production)
  db:
    image: mysql:8.4
    container_name: marsai_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: marsai
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      timeout: 20s
      retries: 10
    networks:
      - marsai-network
    security_opt:
      - no-new-privileges:true

  # Express API Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: marsai_server_prod
    restart: always
    environment:
      DATABASE_URL: mysql://root:${DB_PASSWORD}@db:3306/marsai
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      SCALEWAY_ENDPOINT: ${SCALEWAY_ENDPOINT}
      SCALEWAY_REGION: ${SCALEWAY_REGION}
      SCALEWAY_BUCKET_NAME: ${SCALEWAY_BUCKET_NAME}
      SCALEWAY_FOLDER: ${SCALEWAY_FOLDER}
      SCALEWAY_ACCESS_KEY: ${SCALEWAY_ACCESS_KEY}
      SCALEWAY_SECRET_KEY: ${SCALEWAY_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marsai-network
    security_opt:
      - no-new-privileges:true

  # React Frontend (Nginx - Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: marsai_client_prod
    restart: always
    environment:
      VITE_API_URL: ${FRONTEND_URL}/api
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - marsai-network
    security_opt:
      - no-new-privileges:true

volumes:
  db_data_prod:
    driver: local

networks:
  marsai-network:
    driver: bridge
